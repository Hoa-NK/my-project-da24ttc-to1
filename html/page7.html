<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi màu nền Random</title>

</head>
<body>

    <div class="container">
        <h1>Trình đổi màu nền</h1>
        <span id="color-text">#f0f2f5</span>
        <button id="btn-change">Đổi màu ngay!</button>
    </div>

    <script>
        const nutBam = document.getElementById('btn-change');
        const textHienThi = document.getElementById('color-text');
        const thanThe = document.body;
        function layMauNgauNhien() {
            const chuSoHex = '0123456789ABCDEF';
            let mau = '#';
            for (let i = 0; i < 6; i++) {
                mau += chuSoHex[Math.floor(Math.random() * 16)];
            }
            return mau;
        }
        nutBam.addEventListener('click', function() {
            const mauMoi = layMauNgauNhien();
            thanThe.style.backgroundColor = mauMoi;
            textHienThi.textContent = mauMoi;
            textHienThi.style.color = mauMoi;
        });
    </script>
</body>
</html>
